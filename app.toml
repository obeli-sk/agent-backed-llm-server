app_name = "agent-backed-llm-server"

# Variables with a `${X:-default}` fallback in deployment.toml are optional.
[public_env]
AGENT_CODEX_EXTRA_ARGS = { optional = true }
AGENT_CODEX_MODEL = { optional = true }
AGENT_HOST_CODEX_DIR = { optional = true }
AGENT_IMAGE = { optional = true }
AGENT_MAX_TURNS = { optional = true }
HOME = {}
OBELISK_API_URL = { type = "internal", source = "api-url" }
PATH = {}

[allowed_exec_activities]
"codex.start" = "sha256:5e3a2677de9f64c75b11cf5a964e2d8a999c07561a39c75145a619467a7a5a7c"
"session.send" = "sha256:8faf6e4f53946e7fdf0781b2236569fddeca9e8c351017cc4c0fe08895cc4361"
"session.recv" = "sha256:fdeea124ff86c027927fdf3bd961660fe8ad32c338301e554484d8648a1968ae"
"session.cleanup" = "sha256:b97aebaba5c5d1d4ffb458d53b89b2215d249328adf120e063f3c856b8e70101"
"codex.discover-models" = "sha256:3dbf1b21427933b7649fb4f3a8718ecbf62ad94e6cfba4ee65c9d1b5d25005ff"

[secrets]
# The webhooks call this server's own API with its startup token.
OBELISK_API_TOKEN = { type = "internal" }

[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["GET"]
url_regex_suffix = "/v1/executions(/.*)?$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]

[[outbound_http.allowed_host]]
url_prefix = "${OBELISK_API_URL}"
methods = ["PUT"]
url_regex_suffix = "/v1/executions/[^/]+/stub$"
secrets = ["OBELISK_API_TOKEN"]
replace_in = ["headers"]
