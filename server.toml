# This app runs a second Obelisk instance alongside another one (e.g. the
# obelisk-agent frontend on the default 5005/8080/9090), so every port is shifted
# by +100 to avoid a clash.
api.listening_addr = "127.0.0.1:5105"       # REST API; the app reads it as the internal OBELISK_API_URL
webui.listening_addr = "127.0.0.1:8180"     # Web UI
http_server.internal.listening_addr = "127.0.0.1:9190"  # internal HTTP server; serves POST /v1/chat/completions

# The chat webhook blocks until the LLM turn finishes; match scripts/chat.sh's 600 s client timeout.
[webhooks]
request_timeout.seconds = 600

