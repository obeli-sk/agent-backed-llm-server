# This app runs a second Obelisk instance alongside another one (e.g. the
# obelisk-agent frontend on the default 5005/8080/9090), so every port is shifted
# by +100 to avoid a clash.
api.listening_addr = "127.0.0.1:5105"       # gRPC/REST API; matches OBELISK_API_URL in deployment.toml
webui.listening_addr = "127.0.0.1:8180"     # Web UI
external.listening_addr = "127.0.0.1:9190"  # external HTTP server; serves POST /v1/chat/completions
database.sqlite.directory = "${DATA_DIR}/obelisk-sqlite-agent-backed-llm-server"

allow_exec_activities = [
  "sha256:73ff0d2acf3f1130c91760452dbd3a6fd8d84f094ac32e15586c60b314d873f2", # claude.start (agent-backed-llm:agent/claude.start)
  "sha256:73ff0d2acf3f1130c91760452dbd3a6fd8d84f094ac32e15586c60b314d873f2", # codex.start (agent-backed-llm:agent/codex.start)
  "sha256:536a62d943260b22abcd501467cc819534b18a9cc930e238f0103afdc3e5bac4", # session.send (agent-backed-llm:agent/session.send)
  "sha256:b1a0cb695e54841f4c3cbe1c2ed28f944c0321a0ee9bf6e552a8360fa74fba86", # session.recv (agent-backed-llm:agent/session.recv)
  "sha256:29350a3896ee19e9cf005669bfd2e60d6483f7178d33142a2689c8d5480dc2d6", # session.cleanup (agent-backed-llm:agent/session.cleanup)
]

[secrets]
OBELISK__API__TOKEN = { env = "OBELISK__API__TOKEN" }

[[outbound_http.allowed_host]]
pattern = "${OBELISK_API_URL:-http://127.0.0.1:5105}"
methods = ["GET", "PUT"]
request_url_regex = "^(GET ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5105}/v1/executions|PUT ${OBELISK_API_URL_REGEX:-http://127\\.0\\.0\\.1:5105}/v1/executions/[^/]+/stub$)"
secrets = ["OBELISK__API__TOKEN"]
replace_in = ["headers"]
